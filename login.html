<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CashLog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <h1><i class="fas fa-wallet"></i> CashLog</h1>
                <p>Logbook for your incomes and expenses </p>
            </div>
            
            <!-- Sign Up Form -->
            <div id="signup-form" class="auth-form active">
                <h2>Create Account</h2>
                <form id="signup-form-element">
                    <div class="form-group">
                        <label for="signup-name">Full Name</label>
                        <input type="text" id="signup-name" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="signup-confirm-password">Confirm Password</label>
                        <input type="password" id="signup-confirm-password" required minlength="6">
                    </div>
                    <div id="signup-error-message" class="error-message" style="display: none;"></div>
                    <button type="submit" class="btn-primary btn-full">Sign Up</button>
                </form>
                <p class="auth-toggle">Already have an account? <a href="#" id="show-signin">Sign In</a></p>
            </div>
            
            <!-- Sign In Form -->
            <div id="signin-form" class="auth-form">
                <h2>Sign In</h2>
                <form id="signin-form-element">
                    <div class="form-group">
                        <label for="signin-email">Email</label>
                        <input type="email" id="signin-email" required>
                    </div>
                    <div class="form-group">
                        <label for="signin-password">Password</label>
                        <input type="password" id="signin-password" required>
                    </div>
                    <div id="signin-error-message" class="error-message" style="display: none;"></div>
                    <button type="submit" class="btn-primary btn-full">Sign In</button>
                </form>
                <p class="auth-toggle">New user? <a href="#" id="show-signup">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
